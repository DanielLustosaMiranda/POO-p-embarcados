[env:esp-wrover-kit]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev ; Para esp32 do SSL
;board = esp32cam ; para quem for usar a espcam
framework = arduino
; upload_port = COM9 ; Windows (comente ou troque para /dev/ttyUSB0 no Linux)
monitor_speed = 115200